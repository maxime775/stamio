project_id = "verified-polls"

[auth]
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081/auth/callback", "http://localhost:8081/auth/reset-password"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.sms]
enable_signup = false

[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "Stamio local"
rp_id = "localhost"
rp_origins = ["http://localhost:8081"]

[functions.submit-vote]
verify_jwt = false

[functions.verify-passkey-enrollment]
verify_jwt = false

[functions.delete-passkey]
verify_jwt = false

[functions.get-results]
verify_jwt = false

[functions.get-results-history]
verify_jwt = false
